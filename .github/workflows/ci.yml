name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      # This creates deterministic synthetic input locally; it does not acquire a dataset.
      - run: uv run --frozen pytest tests/release/test_reproducibility_smoke.py -q
      - run: uv run --frozen pytest --basetemp artifacts/ci-pytest -p no:cacheprovider -q