[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberattack-detection-ml"
version = "0.1.0"
description = "Reproducible research foundation for binary cyberattack detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.4",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5,<1.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0.12.20240311",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.setuptools.packages.find]
where = ["src"]
